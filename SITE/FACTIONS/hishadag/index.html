<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#040704;color:#9fb39a;font:14px/1.45 "Courier New",monospace}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
#term{position:fixed;inset:0;padding:18px 20px 40px;overflow-y:auto;cursor:text}
#out div{white-space:pre-wrap;word-break:break-word}
.dim{color:#5d6e59}.hi{color:#d9e8c4}.red{color:#c45050}.amber{color:#c9a05a}.arm{color:#b8c9a8;letter-spacing:.06em}
.her{color:#c45050}
#line{display:flex;gap:.5ch;margin-top:2px}
#ps{white-space:nowrap;color:#6f8a66}
#in{flex:1;min-width:0;background:none;border:0;outline:0;color:#d9e8c4;font:inherit;caret-color:#9fb39a;padding:0}
#term.shake{animation:shake .1s steps(2) 6}
@keyframes shake{50%{transform:translate(2px,-1px)}}

/* appel vidéo */
#call{display:none;position:fixed;inset:0;z-index:40;background:#020202;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#call.on{display:flex}
#cam{position:relative;width:min(420px,86vw);aspect-ratio:4/3;background:#0b0b0b;border:1px solid #2a2a2a;overflow:hidden}
#cam img{width:100%;height:100%;object-fit:cover;filter:grayscale(.85) contrast(1.25) brightness(.55) sepia(.25);opacity:0;transition:opacity 2.5s}
#cam.live img{opacity:1;animation:flick 3.7s infinite}
@keyframes flick{0%,100%{filter:grayscale(.85) contrast(1.25) brightness(.55) sepia(.25)}47%{filter:grayscale(.85) contrast(1.6) brightness(.4) sepia(.25)}48%{transform:translateX(-3px)}49%{transform:none}}
#cam .tag{position:absolute;left:8px;top:6px;font-size:11px;color:#c45050}
#cam .tag::before{content:"● "}
#ring{color:#ccc;text-align:center}
#ring b{display:block;color:#fff;font-size:15px;margin-bottom:4px}
#btns{display:flex;gap:12px}
#btns button{font:inherit;padding:6px 16px;background:#111;border:1px solid #444;color:#ccc;cursor:pointer}
#btns button:hover{border-color:#888}
#sub{min-height:3em;max-width:min(520px,90vw);text-align:center;color:#ddd}
</style>
</head>

`[manuscrit — trad. de l'arménien occidental, scan 1/1]

[fichier chiffré — utiliser : decrypt archive/manuscrits/07_ինգա.enc]</span>`,

une carte, écriture inconnue :

    « La mémoire survivra aussi longtemps que moi. »

[note D. : je sais qui c'est maintenant. je ne sais pas si je dois le remercier.]`
};

const LETTER =
`[manuscrit 07 — déchiffré]

Inga,

si tu lis ceci, c'est que quelqu'un a gardé les autres pages,
et que ce quelqu'un n'est pas moi.

Ne passe pas ta vie à te souvenir à ma place.

de manger au soleil, de ne penser à rien le dimanche.

const CALL_LINES = [
  "…",
  "Tu as lu la lettre.",
  "Personne ne lit la lettre. Même pas moi. Plus maintenant.",
  "Tu sais combien de temps j'ai mis pour retrouver ces pages ?",
  "Non. Tu sais pas.",
  "Je vois ton reflet dans ton écran, au fait. Range ta chambre.",
  "Garde tout ça pour toi. Ou raconte-le. Ils sont morts quand même.",
  "Au moins maintenant, on est deux à s'en souvenir."
];

const HER_LINES = [   // réponses d'Inga aux commandes inconnues une fois qu'elle est là
  "<DUMBF0UNDED> c'est pas une commande, ça.",
  "<DUMBF0UNDED> tu tapes au hasard. c'est mignon.",
  "<DUMBF0UNDED> je te regarde, tu sais.",
  "<DUMBF0UNDED> qui t'a donné le mot de passe ?",
  "<DUMBF0UNDED> continue. je note tout."

/* =====================================================================
   MOTEUR
   ===================================================================== */
const $=id=>document.getElementById(id);
const out=$("out"), inp=$("in"), ps=$("ps"), term=$("term");
let mode="login", fails=0, cwd="", hist=[], hi=0, count=0, herHere=false, decrypting=false, ended=false;

const print=(html,cls)=>{const d=document.createElement("div");if(cls)d.className=cls;d.innerHTML=html;out.append(d);term.scrollTop=term.scrollHeight;};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
/* échappe tout sauf les <span class="..."> du contenu */
const rich=s=>esc(s).replace(/&lt;span class=(["'])([\w ]+)\1&gt;/g,'<span class="$2">').replace(/&lt;\/span&gt;/g,"</span>");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function slow(lines,cls,ms=90){inp.disabled=true;for(const l of lines){print(l,cls);await sleep(ms);}inp.disabled=false;inp.focus();}
const setPs=()=>{ps.textContent = mode==="login" ? "Մուտք ›" : decrypting ? "clé ›" : `invité@hishadag:/${cwd}$`;
  inp.type = (mode==="login"||decrypting) ? "password" : "text";};

/* système de fichiers : chemins dérivés des clés de FS */
const norm=p=>{const parts=[];for(const s of (p.startsWith("/")?p.slice(1):(cwd?cwd+"/":"")+p).split("/")){if(!s||s===".")continue;if(s==="..")parts.pop();else parts.push(s);}return parts.join("/");};
const isFile=p=>p in FS;
const isDir=p=>p===""||Object.keys(FS).some(k=>k.startsWith(p+"/"));
function list(dir,all){const pre=dir?dir+"/":"";const set=new Set();
  for(const k of Object.keys(FS))if(k.startsWith(pre)){const rest=k.slice(pre.length);const name=rest.split("/")[0];set.add(rest.includes("/")?name+"/":name);}
  return [...set].filter(n=>all||!n.startsWith(".")).sort();}

const CMDS={
  help(){print(
`commandes :
  ls [-a] [dossier]     lister
  cd &lt;dossier&gt;          changer de dossier
  cat &lt;fichier&gt;         lire
  decrypt &lt;fichier&gt;     déchiffrer (clé requise)
  whoami                qui suis-je
  clear                 effacer l'écran
  exit                  se déconnecter`,"dim");},
  ls(a){const all=a.includes("-a");const t=a.find(x=>x!=="-a");const d=t?norm(t):cwd;
    if(!isDir(d))return print(`ls: ${esc(t)}: aucun dossier de ce nom`,"red");
    print(list(d,all).map(n=>n.endsWith("/")?`<span class="hi">${esc(n)}</span>`:esc(n)).join("    ")||"<span class='dim'>(vide)</span>");},
  cd(a){const d=norm(a[0]||"/");if(!isDir(d))return print(`cd: ${esc(a[0]||"")}: aucun dossier de ce nom`,"red");cwd=d;},
  cat(a){if(!a[0])return print("cat: quel fichier ?","red");const f=norm(a[0]);
    if(isDir(f)&&!isFile(f))return print(`cat: ${esc(a[0])}: c'est un dossier`,"red");
    if(!isFile(f))return print(`cat: ${esc(a[0])}: fichier introuvable`,"red");
    print(rich(FS[f]));},
  decrypt(a){if(!a[0])return print("decrypt: quel fichier ?","red");const f=norm(a[0]);
    if(!isFile(f))return print(`decrypt: ${esc(a[0])}: fichier introuvable`,"red");
    if(!f.endsWith(".enc"))return print("decrypt: ce fichier n'est pas chiffré","dim");
    decrypting=true;print("clé de déchiffrement requise.","amber");},
  whoami(){print("invité — accès par mot de passe partagé.\n<span class='dim'>(ce mot de passe a été changé il y a 3 minutes. tu es le dernier à l'avoir utilisé.)</span>");},
  clear(){out.innerHTML="";},
  exit(){print("déconnexion.","dim");setTimeout(()=>location.reload(),700);},
  sudo(){print("<DUMBF0UNDED> non.","her");}
};

async function boot(){
  await slow([
    "<span class='dim'>connexion au noeud_03 ……… établie</span>",
    "<span class='dim'>chiffrement ……………………… actif</span>",
    "",
    "<span class='arm'>   Յ Ի Շ Ա Տ Ա Կ</span>",
    "",
    "<span class='arm'>Ե՞րբ այրվեց Զմյուռնիան։</span>"
  ],null,160);
  setPs();
}

async function login(v){
  if(PASSWORD.includes(v.trim())){
    mode="shell";
    await slow(["<span class='hi'>accès accordé.</span>","<span class='dim'>tape help.</span>",""],null,200);
  }else{
    fails++;
    print("Մուտքը մերժված է. — accès refusé.","red");
    if(fails===3)print("<span class='dim'>(la ville a brûlé. tu sais en quelle année.)</span>");
    if(fails===6)print("<span class='dim'>(Smyrne. septembre.)</span>");
  }
}

async function tryKey(v){
  decrypting=false;
  if(!DECRYPTKEY.includes(v.trim().toLowerCase()))return print("clé invalide.","red");
  await slow(["<span class='dim'>déchiffrement ……………… 100%</span>",""],null,500);
  print(esc(LETTER),"hi");
  if(!ended){ended=true;setTimeout(startCall,4500);}
}

function herArrives(){
  herHere=true;term.classList.add("shake");setTimeout(()=>term.classList.remove("shake"),700);
  print("*** DUMBF0UNDED a rejoint le noeud","red");
  setTimeout(()=>print("&lt;DUMBF0UNDED&gt; tiens. un invité.","her"),1800);
}

async function run(raw){
  const [c,...a]=raw.trim().split(/\s+/);
  if(!c)return;
  count++;
  if(CMDS[c])await CMDS[c](a);
  else if(herHere)print(esc(HER_LINES[Math.floor(Math.random()*HER_LINES.length)]),"her");
  else print(`${esc(c)}: commande inconnue — tape help`,"red");
  if(count===7&&!herHere)setTimeout(herArrives,900);
}

inp.addEventListener("keydown",async e=>{
  if(e.key==="Tab"&&mode==="shell"&&!decrypting){
    e.preventDefault();const parts=inp.value.split(/\s+/);const last=parts.pop()||"";
    const slash=last.lastIndexOf("/");const base=last.slice(0,slash+1);const frag=last.slice(slash+1);
    const dir=base?norm(base):cwd;if(!isDir(dir))return;
    const m=list(dir,frag.startsWith(".")).filter(n=>n.startsWith(frag));
    if(m.length===1)inp.value=[...parts,base+m[0]].join(" ");
    else if(m.length>1)print(m.join("    "),"dim");
    return;}
  if(e.key==="ArrowUp"&&mode==="shell"&&!decrypting){e.preventDefault();if(hi>0)inp.value=hist[--hi];return;}
  if(e.key==="ArrowDown"&&mode==="shell"&&!decrypting){e.preventDefault();hi<hist.length-1?inp.value=hist[++hi]:(hi=hist.length,inp.value="");return;}
  if(e.key!=="Enter")return;
  const v=inp.value;inp.value="";
  if(mode==="login"){print(`${esc(ps.textContent)} ${"•".repeat(v.length)}`,"dim");await login(v);}
  else if(decrypting){print(`${esc(ps.textContent)} ${"•".repeat(v.length)}`,"dim");await tryKey(v);}
  else{print(`<span class="dim">${esc(ps.textContent)}</span> ${esc(v)}`);if(v.trim()){hist.push(v);hi=hist.length;}await run(v);}
  setPs();
});
term.addEventListener("click",()=>{if(!getSelection().toString())inp.focus();});

/* ---------- appel vidéo final ---------- */
function startCall(){
  inp.blur();$("call").classList.add("on");
  $("ref").onclick=()=>{$("ring").innerHTML="<b>Appel vidéo entrant</b>DUMBF0UNDED <span class='dim'>(rappel)</span>";};
  $("acc").onclick=async()=>{
    $("btns").remove();$("ring").remove();$("cam").classList.add("live");
    await sleep(2600);
    for(const l of CALL_LINES){$("sub").textContent="";
      for(const ch of l){$("sub").textContent+=ch;await sleep(45);}
      await sleep(1700+l.length*25);}
    $("cam").classList.remove("live");$("cam").querySelector("img").style.opacity=0;
    $("sub").innerHTML="<span class='dim'>appel terminé</span>";
    await sleep(2200);$("call").classList.remove("on");
    print("");print("*** connexion fermée par l'hôte.","red");
    inp.disabled=true;ps.textContent="";
  };
}

setPs();boot();
</script>
