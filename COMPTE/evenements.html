<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes événements</title>
<link rel="shortcut icon" href="https://i.pinimg.com/originals/bc/5e/b5/bc5eb5c00c26a519749f86c79d617e42.gif">
<link rel="stylesheet" href="/DATA/izmir.css">
<link rel="stylesheet" href="/COMPTE/compte.css">
<script src="/DATA/izmir.js"></script>
<script src="/DATA/account.js"></script>
  <script src="/DATA/search.js" defer></script>
</head>

<body>

<div class="page-wrap">

  <div class="sidebar">
    <button id="theme-toggle">☾ nuit</button>

    <div class="box">
      <div class="title">mes événements</div>
      Tous les événements du calendrier auxquels tu as accès, du plus récent au plus ancien,
      sans avoir à tourner les mois un par un. Clique sur un événement pour le déplier.
    </div>

    <div class="box">
      <div class="title">années</div>
      <div class="year-links" id="year-links"></div>
    </div>

    <div class="box">
      <div class="title">tags</div>
      <div class="tags" id="tag-links"></div>
    </div>
  </div>

  <div class="container">
    <div id="site-header"></div>

    <div class="page-title">événements du calendrier</div>

    <div class="note account-gate" id="gate">chargement…</div>

    <div id="content" hidden>
      <div class="toolbar">
        <input class="input" id="filter" type="search" placeholder="filtrer : titre, description, tag…" aria-label="Filtrer les événements">
        <button class="btn" id="sort" type="button">↓ plus récent d'abord</button>
      </div>
      <div class="muted" id="count" style="margin-top:6px"></div>
      <div id="list" class="timeline"></div>
    </div>
  </div>

</div>

<script src="/COMPTE/evenements.js"></script>
</body>
</html>
