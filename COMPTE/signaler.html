<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signaler une erreur</title>
<link rel="shortcut icon" href="https://i.pinimg.com/originals/bc/5e/b5/bc5eb5c00c26a519749f86c79d617e42.gif">
<link rel="stylesheet" href="/DATA/izmir.css">
<link rel="stylesheet" href="/COMPTE/compte.css">
<script src="/DATA/izmir.js"></script>
<script src="/DATA/account.js"></script>
  <script src="/DATA/search.js" defer></script>
</head>

<body>

<div class="page-wrap">

  <div class="sidebar">
    <button id="theme-toggle">☾ nuit</button>

    <div class="box">
      <div class="title">signaler une erreur</div>
      Une faute, un bug visuel, une info fausse, un truc à changer ? Écris-le ici, ça m'arrive directement.
      Tu retrouves en dessous tes signalements et mes réponses.
    </div>
  </div>

  <div class="container">
    <div id="site-header"></div>

    <div class="page-title">signaler une erreur</div>

    <div class="note account-gate" id="gate">chargement…</div>

    <div id="content" hidden>
      <form class="note" id="ticket-form">
        <div class="field">
          <label for="categorie">type</label>
          <select id="categorie" name="categorie">
            <option value="faute">faute d'orthographe / de frappe</option>
            <option value="bug visuel">bug visuel</option>
            <option value="erreur de contenu">erreur de contenu / de lore</option>
            <option value="suggestion">truc à changer / suggestion</option>
            <option value="autre">autre</option>
          </select>
        </div>
        <div class="field">
          <label for="page">page concernée</label>
          <input id="page" name="page" type="text" placeholder="/WIKI/…" maxlength="300">
        </div>
        <div class="field">
          <label for="message">message</label>
          <textarea id="message" name="message" maxlength="4000" required placeholder="qu'est-ce qui ne va pas ?"></textarea>
        </div>
        <button class="btn btn-primary" type="submit">envoyer</button>
        <div class="form-msg" id="form-msg" aria-live="polite"></div>
      </form>

      <div class="title" style="margin-top:18px" id="tickets-title">mes signalements</div>
      <div id="tickets" style="display:flex;flex-direction:column;gap:10px"></div>
    </div>
  </div>

</div>

<script src="/COMPTE/signaler.js"></script>
</body>
</html>
