<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galerie</title>
<link rel="shortcut icon" href="/GALLERIE/favicon.gif">
<link rel="stylesheet" href="/DATA/izmir.css">
<link rel="stylesheet" href="/GALLERIE/gallery.css">

<script src="/DATA/search.js" defer></script>
</head>

<body>
<div class="page-wrap">
    <aside class="sidebar">
        <button id="theme-toggle">☀ jour</button>

        <div class="now">
            <div class="title">— thème —</div>
            <div class="filter-group">
                <button class="tag-btn" data-tag="official">Officiel</button>
                <button class="tag-btn" data-tag="canon">Canon</button>
                <button class="tag-btn" data-tag="noncanon">Non-canon</button>
                <button class="tag-btn" data-tag="spice">Spice</button>
                <button class="tag-btn" data-tag="emote">Emote</button>
                <button class="tag-btn" data-tag="calendrier">Calendrier</button>
                <button class="tag-btn" data-tag="asset">Asset</button>
                <button class="tag-btn" data-tag="video">Video</button>
            </div>
        </div>

        <div class="now">
            <div class="title">— clan —</div>
            <div class="filter-group">
                <button class="tag-btn" data-tag="brujah">Brujah</button>
                <button class="tag-btn" data-tag="ventrue">Ventrue</button>
                <button class="tag-btn" data-tag="tremere">Tremere</button>
                <button class="tag-btn" data-tag="nosferatu">Nosfe</button>
                <button class="tag-btn" data-tag="toreador">Toreador</button>
                <button class="tag-btn" data-tag="autre">Autre</button>
                <button class="tag-btn" data-tag="lasombra">Lasombra</button>
            </div>
        </div>
        
        <div class="now">
            <div class="title">— auteur —</div>
            <div class="filter-group">
                <button class="tag-btn" data-tag="yolnir">Yolnir</button>
                <button class="tag-btn" data-tag="sunny">Sunny</button>
                <button class="tag-btn" data-tag="ashita">Ashita</button>
                <button class="tag-btn" data-tag="autriche">Autriche</button>
                <button class="tag-btn" data-tag="shiva">Shiva</button>
                <button class="tag-btn" data-tag="vincent">Vincent</button>
                <button class="tag-btn" data-tag="deneb">Deneb</button>
            </div>
        </div>

        <button id="reset-btn">Tout afficher</button>
    </aside>

    <main class="container">
        <div id="site-header"></div>

        <div class="box">
<div class="title" id="gallery-title">Galerie</div>           
<div id="character-filters"></div>
            <div id="gallery"></div>

            <div id="gallery-pagination" class="gallery-pagination" aria-label="Pagination de la galerie">
                <button id="gallery-prev" type="button">← Précédent</button>
                <div id="gallery-page-list" class="gallery-page-list"></div>
                <button id="gallery-next" type="button">Suivant →</button>
            </div>
        </div>
    </main>
</div>

<div id="zoom">
    <div class="zoom-media">
        <img id="zoom-img" alt="">
        <video id="zoom-video" controls playsinline hidden></video>
        <div class="zoom-nav">
            <button id="zoom-prev" aria-label="Image précédente">←</button>
            <span id="zoom-counter"></span>
            <button id="zoom-next" aria-label="Image suivante">→</button>
        </div>
        <div id="zoom-tags"></div>
        <div id="zoom-desc"></div>
    </div>
</div>

<script src="/DATA/izmir.js"></script>
<script src="/GALLERIE/gallery-data.js"></script>
<script src="/GALLERIE/gallery.js"></script>
</body>
</html>
