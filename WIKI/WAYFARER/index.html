<!-- PAS TOUCHE, CA FONCTIONNE GRACE A : https://stackoverflow.com/questions/187619/is-there-a-javascript-solution-to-generating-a-table-of-contents-for-a-page </-->
<script>
window.onload = function () {
    var toc = "";
    var level = 0;

    document.getElementById("contents").innerHTML =
        document.getElementById("contents").innerHTML.replace(
            /<h([/d])>([/s/S]*?)<//h/1>/gi,
            function (str, openLevel, innerHtml) {
                openLevel = parseInt(openLevel);

                if (openLevel > level) {
                    toc += (new Array(openLevel - level + 1)).join("<ol>");
                } else if (openLevel < level) {
                    toc += (new Array(level - openLevel + 1)).join("</ol>");
                }

                level = openLevel;

                var tempDiv = document.createElement("div");
                tempDiv.innerHTML = innerHtml;
                var plainText = tempDiv.textContent || tempDiv.innerText || "";

                var anchor = plainText.trim()
                    .replace(//s+/g, "_")
                    .replace(/[^/w/-]/g, "");

                toc += "<li><a href=/"#" + anchor + "/">" + plainText + "</a></li>";

                return "<h" + openLevel + " id=/"" + anchor + "/">" + innerHtml + "</h" + openLevel + ">";
            }
        );

    if (level) {
        toc += (new Array(level + 1)).join("</ol>");
    }

    document.getElementById("toc").innerHTML += toc;
};
</script>
